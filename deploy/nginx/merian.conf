# Proxy inverso para el VPS. Reemplaza los dominios por los tuyos y luego
# ejecuta `certbot --nginx` para que agregue HTTPS (ver DEPLOY.md).
# HTTPS es obligatorio: el navegador no da acceso al microfono en /llamada
# si la pagina no se sirve por https.

# ---------------------------------------------------------------------------
# API publica: interfaz de llamada del paciente + endpoints que usa ElevenLabs.
# Solo se exponen las rutas que necesita internet; la gestion de documentos
# y el historial de llamadas (datos de pacientes) quedan accesibles solo
# desde la consola, que los consume por la red interna de Docker.
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name api.tu-dominio.com;

    location ~ ^/(llamada|query|webhook/post-call|health)(/|$) {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        return 404;
    }
}

# ---------------------------------------------------------------------------
# Consola Streamlit del equipo medico, protegida con usuario/clave.
# Streamlit usa WebSocket, por eso los headers Upgrade/Connection.
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name consola.tu-dominio.com;

    client_max_body_size 50m;

    auth_basic "Consola postoperatorio";
    auth_basic_user_file /etc/nginx/.htpasswd-merian;

    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_buffering off;
    }
}
