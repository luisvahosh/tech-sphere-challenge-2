# Pegar en Nginx Proxy Manager -> Proxy Host postoperatorio.learnway.co
# -> pestana "Advanced" -> Custom Nginx Configuration.
#
# El Proxy Host (pestana Details) apunta a http://ts2-postop-api:8000.
# Estas reglas agregan:
#   /           -> redirige a la interfaz del paciente (/llamada)
#   /consola    -> consola Streamlit (protegida con CONSOLE_PASSWORD)
#   bloquea las rutas de gestion de la API (documentos, historial de
#   pacientes, docs): solo la consola las usa, por la red interna.

location = / {
    return 302 /llamada;
}

location ~ ^/(documents|llamadas|docs|redoc|openapi\.json)(/|$) {
    return 404;
}

location /consola {
    # Variable + resolver de Docker: si el contenedor esta caido, NPM no
    # falla al recargar (y no tumba los demas sitios del servidor).
    resolver 127.0.0.11 valid=30s;
    set $ts2_consola ts2-postop-console;
    proxy_pass http://$ts2_consola:8501;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400s;
    proxy_buffering off;
    client_max_body_size 50m;
}
