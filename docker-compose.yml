# Despliegue en VPS detras de Nginx Proxy Manager (ver DEPLOY.md).
# No se publica ningun puerto en el host: NPM llega a los contenedores por
# su red Docker, asi no hay choques con otros proyectos del servidor.
# Nombres con prefijo ts2- para no colisionar con tech-sphere-challenge (v1).
name: tech-sphere-2

services:
  api:
    build: .
    image: tech-sphere-2:latest
    container_name: ts2-postop-api
    restart: unless-stopped
    env_file: .env
    volumes:
      - postop_data:/app/data
    networks: [interna, npm]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  console:
    build: .
    image: tech-sphere-2:latest
    container_name: ts2-postop-console
    restart: unless-stopped
    command: ["streamlit", "run", "console/app.py", "--server.address=0.0.0.0", "--server.port=8501", "--server.baseUrlPath=consola"]
    environment:
      # Nombre de contenedor (unico en el servidor), no "api": en la red de
      # NPM otro proyecto podria tener tambien un servicio llamado api.
      API_BASE_URL: http://ts2-postop-api:8000
      CONSOLE_PASSWORD: ${CONSOLE_PASSWORD:?Define CONSOLE_PASSWORD en .env}
    networks: [interna, npm]
    depends_on:
      api:
        condition: service_healthy

networks:
  interna:
  npm:
    external: true
    name: ${NPM_NETWORK:-npm_default}

volumes:
  postop_data:
